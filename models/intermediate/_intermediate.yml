models:
  - name: int_public__cardingest
    description: union of dfs and sfc models
    config:
      materialized: view
      group: word_count_team
      access: public
      contract:
        enforced: true
    columns:
      - name: load_date
        data_type: date
        description: ""
        tests:
          - not_null

      - name: card_name
        data_type: varchar
        description: ""

      - name: card_text
        data_type: varchar
        description: ""

      - name: flavor_text
        data_type: varchar
        description: ""

      - name: set_name
        data_type: varchar
        description: ""
        tests:
          - accepted_values:
              arguments:
                values: ['Lorwyn', 'Shadowmoor', 'Morningtide', 'Eventide']
      - name: set_type
        data_type: varchar
        description: ""

      - name: rarity
        data_type: varchar
        description: ""

      - name: mana_value
        data_type: varchar
        description: ""

      - name: color_list
        data_type: array
        description: ""

      - name: card_type
        data_type: varchar
        description: ""

      - name: price1
        data_type: variant
        description: ""

      - name: price2
        data_type: variant
        description: ""

      - name: price
        data_type: float
        description: ""

      - name: reprint
        data_type: boolean
        description: ""

      - name: artist
        data_type: varchar
        description: ""

      - name: frame_effects
        data_type: array
        description: ""

      - name: date_released
        data_type: date
        description: ""

      - name: uri
        data_type: varchar
        description: ""
    
      - name: image_uri
        data_type: varchar
        description: ""    